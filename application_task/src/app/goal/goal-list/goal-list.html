<div>
  <input [(ngModel)]="newTitle" placeholder="Nouvelle tâche">
  <button (click)="addGoal()">Ajouter un objectif</button>
</div>


@for (goal of goals; track goal.id) {
  <app-goal-item
    [goal]="goal"
    [tasks]="tasksForGoal(goal.id)"
    (goalCompleted)="onGoalCompleted($event)"
    (goalDeleted)="onGoalDeleted($event)"
    (taskCompleted)="onTaskCompleted($event)"
    (taskDeleted)="onTaskDeleted($event)">
  </app-goal-item>
}
